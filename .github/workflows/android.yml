# בונה את אפליקציית הנגן (APK חתום) ומפרסם אותה בעמוד ההורדות (Releases).
# רץ בכל העלאה לענף main, או בלחיצה ידנית (Actions ← Build APK ← Run workflow).
name: Build APK
on:
  push:
    branches: [main, sulam]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: בדיקת מפתח החתימה
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          P="$(printf '%s' "$KEYSTORE_PASS" | tr -d ' \r\n\t')"
          if [ -z "$P" ]; then echo "::error::חסר הסוד KEYSTORE_PASS (Settings ← Secrets and variables ← Actions)"; exit 1; fi
          echo "::add-mask::$P"
          K="$RUNNER_TEMP/release.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/chasima-release.jks.enc -out "$K" -pass pass:"$P" 2>/dev/null || true
          keytool -list -keystore "$K" -storepass "$P" >/dev/null 2>&1 || { echo "::error::הסיסמה KEYSTORE_PASS לא נכונה"; exit 1; }
          echo "KS_PASS=$P" >> "$GITHUB_ENV"
      - name: גרסה
        id: ver
        run: echo "v=$(jq -r .version version.json)" >> "$GITHUB_OUTPUT"
      - name: בניית APK חתום
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASS: ${{ env.KS_PASS }}
          VERSION_NAME: ${{ steps.ver.outputs.v }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log" || { M=$(grep -E "error:|What went wrong" -A6 "$RUNNER_TEMP/gradle.log" | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g'); echo "::error title=gradle::$M"; exit 1; }
          cp app/build/outputs/apk/release/app-release.apk ../chasima-chachama.apk
          cp parent/build/outputs/apk/release/parent-release.apk ../chasima-horim.apk
      - name: קובץ לבדיקה (ענף שאינו main – בלי פרסום לנגן)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: apk-test
          path: |
            chasima-chachama.apk
            chasima-horim.apk
      - name: פרסום בעמוד ההורדות
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}-${{ github.run_number }}
          name: חסימה חכמה ${{ steps.ver.outputs.v }} (${{ github.run_number }})
          body_path: RELEASE_NOTES.md
          files: |
            chasima-chachama.apk
            chasima-horim.apk
          make_latest: true
