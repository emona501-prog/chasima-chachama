import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// כתובת מסד הנתונים (Firebase) נקראת מהקובץ config.json שבראש הפרויקט
def appCfg = new JsonSlurper().parse(rootProject.file('../config.json'))

android {
    namespace = "com.chaiapps.chasima"
    compileSdk = 35
    defaultConfig {
        applicationId "com.chaiapps.chasima"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode = Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
        versionName = (System.getenv("VERSION_NAME") ?: "1.0.0")
        buildConfigField "String", "DB_URL", "\"${appCfg.dbUrl}\""
    }
    buildFeatures {
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        release {
            def ks = System.getenv("KEYSTORE_PATH")
            if (ks) {
                storeFile file(ks)
                storePassword(System.getenv("KEYSTORE_PASS"))
                keyAlias "chasima"
                keyPassword(System.getenv("KEYSTORE_PASS"))
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
